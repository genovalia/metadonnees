name: Validate

on:
  pull_request:
    branches: [dev, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-root

      - name: Validate the datasets
        run: poetry run python catalogue_cli.py validate

      - name: Run tests
        run: poetry run pytest -q

  # What merging this PR would change in the API the base branch syncs to,
  # shown in the job summary. Reads are public, so this needs no key and no
  # Environment (whose branch rules would refuse a feature branch anyway).
  dry-run:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-root

      # Same URLs as the METADATA_API_URL var of the dev and prod Environments.
      - name: Dry run against the target API
        run: |
          case "${{ github.base_ref }}" in
            main) URL=https://metadata-api.apps.genovalia.ulaval.ca ;;
            *)    URL=https://metadata-api-dev.apps.genovalia.ulaval.ca ;;
          esac
          poetry run python catalogue_cli.py sync --dry-run --base-url "$URL"

  notify-failure:
    if: failure()
    needs: [validate, dry-run]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: "github-ci"
            text: ":x: *${{ github.event.repository.name }}* — `${{ github.workflow }}` failed on <${{ github.event.pull_request.html_url }}|PR #${{ github.event.pull_request.number }}> (<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|logs>)"
