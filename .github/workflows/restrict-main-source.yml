name: Restrict main to PRs from dev

on:
  pull_request:
    branches: [main]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      # Through env, not ${{ }} in the script: this repo is public, and a
      # fork's branch name is attacker-controlled.
      - name: Vérifier que la PR provient de dev
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::Les PR vers main doivent provenir de la branche dev (source actuelle : $HEAD_REF)."
            exit 1
          fi

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: "github-ci"
            text: ":x: *${{ github.event.repository.name }}* — `${{ github.workflow }}` failed on <${{ github.event.pull_request.html_url }}|PR #${{ github.event.pull_request.number }}> (<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|logs>)"
